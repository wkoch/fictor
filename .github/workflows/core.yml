name: Core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  ubuntu:
    name: Ubuntu 22.04 x86-64 — complete suite and real sandbox
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: core
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap ripgrep util-linux
          bwrap --version
          rg --version
          unshare --version
        # Keep kernel/userns/AppArmor policies intact: unavailable isolation fails tests.

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: false
          rust-src-dir: core

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint all targets
        run: cargo clippy --all-targets --locked --offline -- -D warnings

      - name: Test complete suite with real Linux sandbox
        # Fake secrets and local endpoints only; no test is skipped on this host.
        run: cargo test --locked --offline

  fedora:
    name: Fedora 44 x86-64 container — build and tests without real sandbox
    runs-on: ubuntu-22.04
    # Stable COSMIC Atomic release checked against the Fedora Project on 2026-10-17.
    # Match this version to the user's release when the validated target advances.
    container:
      image: registry.fedoraproject.org/fedora:44
      # Ordinary sandbox data must use an admitted filesystem (ADR-044).
      # The image's overlay remains restricted to fixed system bases.
      options: --tmpfs /tmp:rw,nosuid,nodev,mode=1777
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: core
    steps:
      - name: Install build dependencies
        working-directory: /
        run: dnf install --assumeyes gcc gcc-c++ make git curl-minimal tar gzip xz pkgconf-pkg-config openssl-devel ca-certificates findutils util-linux

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: false
          rust-src-dir: core

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Build all test targets
        run: cargo test --no-run --locked --offline

      - name: Test without nested sandbox
        # Real namespace tests (mount_origins, mount_plan, sandbox, sandbox_init,
        # supervisor, spawn_barrier, instance_recovery_legacy, the ownership bind
        # alias and the magic-link unit) run in full on
        # Ubuntu and on the user's desktop. The doctor test also invokes bwrap.
        # Most units, protocols, proxies and inert local bundles need no userns.
        run: >-
          cargo test --locked --offline --lib
          --test activation --test admin --test blob_ownership --test bootstrap --test budget
          --test control_files --test crash_recovery --test extension_control
          --test install_online --test install_status_races --test instance_recovery
          --test kernel --test kernel_catalog --test kernel_read_limits --test kernel_tools --test local_checker
          --test manifest --test migrations --test model_tls --test models --test overrides --test ownership --test proposals
          --test promotion --test promotion_crash --test promotion_journal --test promotion_order --test proposal_recovery
          --test proxy --test secrets_ownership --test store
          -- --skip doctor_reports_development_runtime_status_without_modifying_config
          --skip a_bind_alias_in_a_private_namespace_competes_for_the_same_inode
          --skip permission_templates_and_home_files_reject_original_magic_links

      - name: Test dependency planning and unsupported runtime refusal
        # Actual npm/uv execution currently requires the development Toolbx.
        # These cases exercise validation and refusal, without faking its marker.
        run: |
          cargo test --locked --offline --test dependencies plans_require_lockfiles_and_reject_ambiguous_or_malformed_metadata
          cargo test --locked --offline --test dependencies dependency_execution_is_refused_outside_the_actual_development_toolbx
