[package]
name = "fictor"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
jsonschema = { version = "0.59.0", default-features = false }
serde_yaml_ng = "0.10.0"
serde_json_canonicalizer = "0.4.1"
unicode-normalization = "0.1.24"
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-async-rw"] }
http-body-util = "0.1.3"
hyper = { version = "1.12.0", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
keyring-core = "1.0.1"
libc = "0.2.190"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = "3.0.0"

zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
